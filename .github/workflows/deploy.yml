name: Build project

on: 
  push:
    # 只有参与构建/打包的路径变化才重建，避免改文档/README 也跑 jar 构建
    paths:
      - 'src/**'
      - 'annotations/**'
      - 'compiler/**'
      - 'utils-agent/**'
      - 'magic-accessor/**'
      - 'assets/**'
      - '_libs/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'mod.hjson'
      - 'jitpack.yml'
      - '.github/workflows/deploy.yml'
  workflow_call:

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up PATH
      run: |
        echo "${ANDROID_HOME}/build-tools/30.0.1" >> $GITHUB_PATH

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: temurin

    - name: Get latest release version
      id: get_version
      run: |
        latest_version=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
        echo "LATEST_VERSION=${latest_version}" >> $GITHUB_ENV

    - name: Build mod jar
      run: |
        chmod 777 gradlew
        ./gradlew ZCompileAll

    - name: Unpack for upload
      run: |
        mkdir -p build/unpacked
        unzip build/libs/${{ github.event.repository.name }}-deploy.jar -d build/unpacked

    - name: Upload unpacked jar contents
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.event.repository.name }}[${{ env.LATEST_VERSION }}]
        path: build/unpacked
