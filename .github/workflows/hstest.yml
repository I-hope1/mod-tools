name: hstest

# 正式回归门槛（原 suite.sh 已并入 hstestJunit）。首次在 Linux runner 上跑，预期会暴露
# Windows 假设（路径分隔符、GBK/UTF-8、F:/ 默认值、Mindustry 依赖解析等）；按原因分类后再定，
# 不要为了绿而改期望值。
#
# 工具链：setup-java 装 8/11/17/21 并导出 JAVA_HOME_<v>_X64；Gradle 通过
# org.gradle.java.installations.fromEnv 发现它们，auto-detect / auto-download 都关掉，
# 避免再次出现"悄悄选中 21.0.9"这类问题。hstest.requireJdks=true 让缺失工具链硬失败。

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: hstest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hstest:
    name: hstest (JUnit, javac 8/11/17/21)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up toolchain JDKs (8/11/17/21)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            21

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run hstest JUnit
        run: |
          chmod +x gradlew
          ./gradlew check \
            -Dhstest.requireJdks=true \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

      # 失败时保留 JUnit XML / HTML，便于直接看是哪个类、哪条断言。
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hstest-reports
          path: |
            build/test-results
            build/reports
          if-no-files-found: ignore
