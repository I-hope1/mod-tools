//@groovy.transform.CompileStatic
class Reflect {
	static final jdkExports0
	static moduleBlackList = [
			'jdk.jdeps',
			'jdk.naming.dns',
			'jdk.jlink',
			'jdk.charsets',
			'jdk.jpackage',
			'jdk.localedata',
			'jdk.jstatd',
			'jdk.naming.rmi',
			'jdk.editpad',
			'jdk.crypto.mscapi',
			'jdk.crypto.cryptoki',
			'jdk.jdeps',
			'jdk.proxy',
			'jdk.hotspot.agent'
	]
	public static final Lookup IMPL_LOOKUP
	static {
		var jdkExports = []
		try {
			Constructor<?> constructor = ReflectionFactory.getReflectionFactory().newConstructorForSerialization(Lookup.class, Lookup.class.getDeclaredConstructor(Class.class));
			Lookup lookup = (Lookup) constructor.newInstance(Lookup.class);
			var methodHandle = lookup.findStaticGetter(Lookup.class, "IMPL_LOOKUP", Lookup.class)
			IMPL_LOOKUP = (Lookup) methodHandle.invokeWithArguments();
//			def mh = IMPL.findGetter(Module.class, "exportedPackages", Map.class)
//			def WPM = Class.forName('java.lang.WeakPairMap')
//			def exports = IMPL_LOOKUP.findStaticGetter(Class.forName('java.lang.Module$ReflectionData'), 'exports', WPM).invokeWithArguments()
//			def map = IMPL_LOOKUP.findGetter(WPM, 'map', ConcurrentHashMap.class).invokeWithArguments(exports)
			ModuleLayer.boot().modules().forEach { m ->
				if (m.name in moduleBlackList) return
				m.packages.forEach {
					jdkExports += "$m.name/$it"
				}
			}
//			println jdkExports0
		} catch (Throwable e) {
			e.printStackTrace()
		}
		jdkExports0 = jdkExports
	}
}

// ---------------------------------------------------------------
// 对齐器验证套件（scratch/hstest）接入构建。
//
// 背景：这些断言原先完全在构建之外（scratch/hstest 不在任何 source set 里），
// `BUILD SUCCESSFUL` 对它们没有任何约束 —— 断言组 7 曾长期是红的而构建一直绿。
//
// 设计（按 review 建议，不再用 shell 手写 classpath）：
//   • hstest source set 只放**测试入口**（同名 fixture 分属不同版本，不能混编）；
//   • ASM 等依赖由 project(":hotswap-agent") 传递，不列 jar；
//   • toolchain 固定为 21，不依赖 PATH 上恰好是什么 javac；
//   • 夹具仍由脚本按版本编到各自目录（它们同包同名），之后应改为硬编码字节码。
// ---------------------------------------------------------------
sourceSets {
	hstest {
		java.srcDirs = ["scratch/hstest/src"]
		compileClasspath += sourceSets.main.output + configurations.compileClasspath
	}
}


dependencies {
	hstestImplementation project(":hotswap-agent")
	hstestImplementation project(":jni-agent")
}

// javaLauncher 只管**运行**，不管编译：不设这一行，测试入口会被编成宿主 JDK 的
// major 版本（实测 69 = JDK 25），运行时可能 UnsupportedClassVersionError。
// 注意：不能给 hstest 设 toolchain 21、也不能设 options.release=21 ——
// 两者都会让 Gradle 认为 hstest 的目标运行版本是 21，进而拒绝消费用 25 编的
// hotswap-agent / jni-agent。测试入口就跟着宿主 JDK 编（与那些库一致），
// 需要跨版本读字节码的是**夹具**，它们由 --release 21 单独编译。

// 每个入口一个任务；断言失败 => 非零退出 => 构建变红。
def hstestEntry = { String name, String cls, List<String> fixtureArgs ->
	tasks.register("hstest" + name, JavaExec) {
		group = "verification"
		description = "运行 " + cls
		dependsOn tasks.named("hstestClasses")
		classpath = sourceSets.hstest.runtimeClasspath
		mainClass = cls
		// 用宿主 JDK 运行（与 hotswap-agent/jni-agent 的编译版本一致）。
		// 不要钉 21：那些库是用 25 编的，钉 21 会让 Gradle 拒绝解析依赖
		// （"only compatible with JVM runtime version 25 or newer"）。
		// 夹具由 --release 21 单独编，ASM 9.9.1 能读。
		// 夹具目录由 run.sh 按版本编译；此处只跑入口
		args = fixtureArgs
	}
}

hstestEntry("SemAssert", "SemAssert", [])

// 自检：验证 "套件内断言失败 -> 进程非零退出" 的整条链。
//
// 为什么不是 hstestCanary：那是一个无条件失败的 Gradle 任务，只证明"Gradle 任务失败
// 会让构建变红"，这件事本来就成立。这里要守的是 check() -> 失败计数 -> 退出码。
//
// selfCheckRun 以开关关闭运行（自检失败被记录后抵消），必须成功；
// selfCheckExpose 以开关打开运行（保留那次失败），必须**失败** —— 后者才证明链是通的。
tasks.register("hstestSelfCheckRun", JavaExec) {
	group = "verification"
	description = "自检（开关关闭）：应成功"
	classpath = sourceSets.hstest.runtimeClasspath
	mainClass = "SemAssertSelfCheck"
}
tasks.register("hstestSelfCheckExpose", JavaExec) {
	group = "verification"
	description = "自检（开关打开）：应失败，用于证明退出码链是通的（预期红）"
	classpath = sourceSets.hstest.runtimeClasspath
	mainClass = "SemAssertSelfCheck"
	environment "HSTEST_SELFCHECK_EXPOSE", "1"
}

// 金丝雀：**不依赖任何源文件**的故意失败任务，用来证明"断言失败会变红"。
// 已实测：> Task :hstestCanary FAILED / BUILD FAILED。
tasks.register("hstestCanary", JavaExec) {
	group = "verification"
	description = "金丝雀：故意失败，验证构建对断言失败有约束（预期红）"
	classpath = sourceSets.hstest.runtimeClasspath
	mainClass = "java.util.logging.ConsoleHandler"   // 无 main，必然非零退出
	ignoreExitValue = false
}

// 套件唯一入口：classpath 由 Gradle 解析后经环境变量传入，脚本内不手写 classpath。
tasks.register("hstestRun", Exec) {
	dependsOn tasks.named("hstestClasses")   // 没有它，classpath 里的类可能尚未编译
	group = "verification"
	description = "运行对齐器验证套件（含数量基线；失败则构建失败）"
	workingDir = file("$rootDir/scratch/hstest")
	// 用命令行参数传 classpath（环境变量在 Exec 下不可靠），
	// 并在配置期冻结为字符串，避免 Exec 延迟求值时拿到空值。
	def cp = sourceSets.hstest.runtimeClasspath.asPath
	def javaBin = "${System.getProperty('java.home')}/bin/java"
	// 三个 javac 在 Gradle 侧解析成**绝对路径**，与 daemon 的 PATH 解耦
	def jdk8  = System.getenv('HSTEST_JAVAC8')  ?: 'F:/files/java/jdks/jdk-1.8/bin/javac.exe'
	def jdk17 = System.getenv('HSTEST_JAVAC17') ?: 'F:/files/java/jdks/jdk-17.0.2/bin/javac.exe'
	def jdk21 = System.getenv('HSTEST_JAVAC21') ?: 'F:/files/java/jdks/openjdk-21.0.2/bin/javac.exe'
	[ [jdk8, true], [jdk17, true], [jdk21, true] ].each { f, _ ->
		if (!new File(f).exists()) logger.warn("hstest: javac 不存在: " + f)
	}
	doFirst {
		// 必须指定 **Git Bash 的绝对路径**。
		//
		// PATH 上的 `bash` 会解析到 C:\Windows\System32\bash.exe —— 那是 **WSL**，
		// 而 WSL 是 Linux，**根本执行不了 Windows 的 javac.exe**（F: 也不在 /mnt 下）。
		// 实测症状：cwd=/mnt/e/...、javac=/mnt/f/...: No such file or directory。
		// 因此不依赖 PATH，直接找 Git Bash。
		def candidates = ["E:/Program Files/Git/bin/bash.exe",
		                  "C:/Program Files/Git/bin/bash.exe",
		                  "E:/Program Files/Git/usr/bin/bash.exe",
		                  "C:/Program Files/Git/usr/bin/bash.exe"]
		def gitBash = candidates.find { new File(it).exists() }
		if (gitBash == null) {
			throw new GradleException("hstest 需要 Git Bash，但以下路径都没有: " + candidates)
		}
		logger.lifecycle("hstest: Git Bash = " + gitBash)
		commandLine gitBash, "suite.sh", cp
		environment "HSTEST_JAVA", javaBin
		environment "HSTEST_JAVAC8", jdk8
		environment "HSTEST_JAVAC17", jdk17
		environment "HSTEST_JAVAC21", jdk21
	}
	standardOutput = System.out
	errorOutput = System.err
}
tasks.named("check") { dependsOn tasks.named("hstestRun") }

// 汇总入口。**尚未挂在 check 上**：夹具编译还没接进来（夹具各版本同包同名，
// 不能混编），因此 hstestSemAssert 目前缺参数会在运行期失败。等夹具改成
// 硬编码字节码、参数可确定后再 dependsOn 到 check。
tasks.register("hstest") {
	group = "verification"
	description = "运行对齐器验证套件（夹具接线中，暂为红）"
	dependsOn tasks.named("hstestSemAssert")
}

// 打印 hstest 运行 classpath，供手工实验复用（唯一可信来源，避免手拼）
tasks.register("hstestCp") {
	doLast {
		println sourceSets.hstest.runtimeClasspath.asPath
	}
}
