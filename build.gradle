task jarAndroid(type: JavaExec) {
	dependsOn "jar"

	if (!sdkRoot || !new File(sdkRoot).exists()) throw new GradleException("No valid Android SDK found. Ensure that ANDROID_HOME is set to your Android SDK directory.")

	if (!platformRoot) throw new GradleException("No android.jar found. Ensure that you have an Android platform installed.")

	//collect dependencies needed for desugaring
	def dependencies = (configurations.compileClasspath.asList())
			.collectMany { ["--classpath", "$it.path"] }

	def buildToolsDir = file("$sdkRoot/build-tools")
	def minApiInt = minApi as int
	def d8Root = buildToolsDir.exists() ? buildToolsDir.listFiles()
			?.findAll { it.isDirectory() }
			// 提取目录名开头的数字主版本号（例如 "34.0.0" -> 34）
			?.collect { dir ->
				def matcher = (dir.name =~ /^(\d+)/)
				def majorVersion = matcher ? matcher[0][1] as int : -1
				[dir: dir, major: majorVersion]
			}
			// 按主版本号降序排列（优先选用最新、支持特性最多的 build-tools）
			?.sort { a, b -> b.major <=> a.major }
			// 找到第一个主版本满足 minApi 且目录下包含 d8 的工具目录
			?.find { item ->
				item.major >= minApiInt && item.dir.listFiles()?.any { it.name.startsWith("d8") }
			}?.dir : null

	if (!d8Root) {
       throw new GradleException("未能在 $sdkRoot/build-tools 下找到满足 minApi ($minApi) 的 d8 工具，请检查 Android SDK 配置！")
	}

	classpath("$d8Root/lib/d8.jar")
	mainClass = "com.android.tools.r8.D8"
	def platformJar = new File(platformRoot, "android.jar")
	def desugarLibJar = configurations.desugarLib.files.find { it.name.endsWith('.jar') }


	args = [
			"--lib", "$platformJar.path",
	] + dependencies + [
//			"--desugared-lib", desugarLibJar.absolutePath,
"--min-api", "$minApi",
"--output", "$buildDir0/libs/${archivesName}-android.jar",
"$buildDir0/libs/${archivesName}-${version}.jar",
	]
}

/*
 * remold 的 agent 必须是一个自包含的 jar：
 * 1) HotSwapManager.getAgentPath() 只认 libs/remold-agent.jar；
 * 2) agent jar 由 system classloader 加载，拆成多个 jar 时 plugin-arc 里的
 *    remold/arc、remold/ref、remold/profiler 在 agent 侧不可见（NoClassDefFoundError）。
 * core 与 plugin-arc 的类不重叠，直接合并即可；清单里的 Agent-Class 显式写死。
 */
def remoldAgentJar = tasks.register("remoldAgentJar", Jar) {
	archiveFileName = "remold-agent.jar"
	destinationDirectory = layout.buildDirectory.dir("remold")
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	dependsOn configurations.remoldAgentLib, configurations.remoldPluginArcLib, configurations.remoldAsmLib
	// zipTree 会让 Gradle 丢失产物间的任务依赖，所以上面显式 dependsOn
	from({ configurations.remoldAgentLib.collect { zipTree(it) } })
	from({ configurations.remoldPluginArcLib.collect { zipTree(it) } })
	from({ configurations.remoldAsmLib.collect { zipTree(it) } })
	exclude "META-INF/MANIFEST.MF"
	exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
	exclude "**/module-info.class"
	manifest {
		attributes(
				"Agent-Class"            : "remold.RemoldAgent",
				"Premain-Class"          : "remold.RemoldAgent",
				"Can-Retransform-Classes": "true",
				"Can-Redefine-Classes"   : "true"
		)
	}
}

jar {
	archiveFileName = "${archivesName}-${version}.jar"

	from(configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) })

	from(rootDir) { include "mod.hjson" }
	from("assets/") { include "**" }
	from(zipTree("${project(":annotations").buildDir0}/libs/annotations-${version}.jar")) {
		include "**/settings/**"
	}

	Consumer<String> includeLib = name -> {
//		println "includeLib: $name"
		evaluationDependsOn(":" + name) // 确保 xxx 的 build.gradle 先运行
		def agent = project(":" + name)
		dependsOn agent.tasks.named("jar")
		from("${agent.buildDir0}/libs/") { include "$name-${agent.version}.jar" rename { o -> "libs/${name}.jar" } }
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	includeLib.accept("utils-agent")
	from(remoldAgentJar) { into "libs" }
	from(configurations.remoldPanamaLib) {
		into "libs"
		rename { String name -> "remold-panama.jar" }
	}
}
// 定义发送指令的辅助方法
static def sendGameCommand(int command) {
	try {
		// 连接本地游戏端口
		def socket = new Socket("127.0.0.1", 35791)
		socket.setSoTimeout(500) // 避免卡死
		socket.getOutputStream().write(command)
		socket.close()
	} catch (Exception e) {
		// 游戏没运行，忽略错误
		// println "Game not running, skipping command."
	}
}

