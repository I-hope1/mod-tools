//@groovy.transform.CompileStatic
class Reflect {
	static final jdkExports0
	static moduleBlackList = [
			'jdk.jdeps',
			'jdk.naming.dns',
			'jdk.jlink',
			'jdk.charsets',
			'jdk.jpackage',
			'jdk.localedata',
			'jdk.jstatd',
			'jdk.naming.rmi',
			'jdk.editpad',
			'jdk.crypto.mscapi',
			'jdk.crypto.cryptoki',
			'jdk.jdeps',
			'jdk.proxy',
			'jdk.hotspot.agent'
	]
	public static final Lookup IMPL_LOOKUP
	static {
		var jdkExports = []
		try {
			Constructor<?> constructor = ReflectionFactory.getReflectionFactory().newConstructorForSerialization(Lookup.class, Lookup.class.getDeclaredConstructor(Class.class));
			Lookup lookup = (Lookup) constructor.newInstance(Lookup.class);
			var methodHandle = lookup.findStaticGetter(Lookup.class, "IMPL_LOOKUP", Lookup.class)
			IMPL_LOOKUP = (Lookup) methodHandle.invokeWithArguments();
//			def mh = IMPL.findGetter(Module.class, "exportedPackages", Map.class)
//			def WPM = Class.forName('java.lang.WeakPairMap')
//			def exports = IMPL_LOOKUP.findStaticGetter(Class.forName('java.lang.Module$ReflectionData'), 'exports', WPM).invokeWithArguments()
//			def map = IMPL_LOOKUP.findGetter(WPM, 'map', ConcurrentHashMap.class).invokeWithArguments(exports)
			ModuleLayer.boot().modules().forEach { m ->
				if (m.name in moduleBlackList) return
				m.packages.forEach {
					jdkExports += "$m.name/$it"
				}
			}
//			println jdkExports0
		} catch (Throwable e) {
			e.printStackTrace()
		}
		jdkExports0 = jdkExports
	}
}

// ---------------------------------------------------------------
// 对齐器验证套件（scratch/hstest）接入构建。
//
// 背景：这些断言原先完全在构建之外（scratch/hstest 不在任何 source set 里），
// `BUILD SUCCESSFUL` 对它们没有任何约束 —— 断言组 7 曾长期是红的而构建一直绿。
//
// 设计（按 review 建议，不再用 shell 手写 classpath）：
//   • hstest source set 只放**测试入口**（同名 fixture 分属不同版本，不能混编）；
//   • ASM 等依赖由 project(":hotswap-agent") 传递，不列 jar；
//   • toolchain 固定为 21，不依赖 PATH 上恰好是什么 javac；
//   • 夹具仍由脚本按版本编到各自目录（它们同包同名），之后应改为硬编码字节码。
// ---------------------------------------------------------------
sourceSets {
	hstest {
		java.srcDirs = ["scratch/hstest/src"]
		compileClasspath += sourceSets.main.output + configurations.compileClasspath
	}
	// Kotlin 夹具（构建期编译，见 hstestInitFixOracle）。
	// v1/v2 是**同名同类**，必须分属两个编译单元、各自独立输出目录；
	// InitFixOracle 按目录路径读字节 + 独立 ByteLoader 定义类，
	// 这两个输出目录**绝不能**出现在任何 classpath 上（否则同名类只会命中其一）。
	ktfixV1 {
		kotlin.srcDirs = ["scratch/hstest/ktfix/v1"]
	}
	ktfixV2 {
		kotlin.srcDirs = ["scratch/hstest/ktfix/v2"]
	}
}


dependencies {
	hstestImplementation project(":hotswap-agent")
	hstestImplementation project(":jni-agent")
	hstestImplementation "Anuken:Mindustry:$mindustryVersion"
	// 新建 source set 的 classpath 为空，KGP 不会自动补 stdlib；夹具引用 kotlin.* 必须显式声明。
	// 版本交由 KGP 的 kotlin-stdlib 约束解析（与 main 的 kotlin-stdlib-jdk8 同源）。
	ktfixV1Implementation "org.jetbrains.kotlin:kotlin-stdlib"
	ktfixV2Implementation "org.jetbrains.kotlin:kotlin-stdlib"
	// hstest 的 JUnit 试点入口（hstestJunit）。与 main 的 test 无关，只挂在 hstest 这套
	// 手工夹具体系上。BOM 统一版本；launcher 必须在 runtimeOnly。
	hstestImplementation platform("org.junit:junit-bom:5.11.4")
	hstestImplementation "org.junit.jupiter:junit-jupiter"
	hstestRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// javaLauncher 只管**运行**，不管编译：不设这一行，测试入口会被编成宿主 JDK 的
// major 版本（实测 69 = JDK 25），运行时可能 UnsupportedClassVersionError。
// 注意：不能给 hstest 设 toolchain 21、也不能设 options.release=21 ——
// 两者都会让 Gradle 认为 hstest 的目标运行版本是 21，进而拒绝消费用 25 编的
// hotswap-agent / jni-agent。测试入口就跟着宿主 JDK 编（与那些库一致），
// 需要跨版本读字节码的是**夹具**，它们由 --release 21 单独编译。

// 并发入口加固断言（先红后绿）。
// 守的是 processChanges 全流程串行 —— scheduler 单线程只覆盖"监听→防抖→热更"，
// 绕过它的入口（UI 按钮 daemon 线程、init 的 else 分支）会与之重叠。
tasks.register("hstestConcurrency", JavaExec) {
	group = "verification"
	description = "运行并发入口加固断言（锁不变量 / 可重入 / 探针）"
	dependsOn tasks.named("hstestClasses")
	// 同 hstestInitFixOracle：runtimeClasspath 解析到 build/libs 下的 jar，
	// 少了 dependsOn jar 会跑出陈旧结果（改动只进 classes、没进 jar）。
	dependsOn project(":hotswap-agent").tasks.named("jar")
	dependsOn project(":jni-agent").tasks.named("jar")
	classpath = sourceSets.hstest.runtimeClasspath
	mainClass = "ConcurrencyAssert"
}
tasks.named("check") { dependsOn tasks.named("hstestConcurrency") }

// 指纹延后落账断言：守"失败/被拒的类不得留下指纹，否则再触发会被误判为 unchanged"。
tasks.register("hstestFingerprint", JavaExec) {
	group = "verification"
	description = "运行指纹延后落账断言"
	dependsOn tasks.named("hstestClasses")
	dependsOn project(":hotswap-agent").tasks.named("jar")
	dependsOn project(":jni-agent").tasks.named("jar")
	classpath = sourceSets.hstest.runtimeClasspath
	mainClass = "FingerprintAssert"
}
tasks.named("check") { dependsOn tasks.named("hstestFingerprint") }

// 布局门规则表断言（纯函数，先红后绿的前半）。
tasks.register("hstestLayoutGate", JavaExec) {
	group = "verification"
	description = "运行 LayoutGate 规则表断言"
	dependsOn tasks.named("hstestClasses")
	dependsOn project(":hotswap-agent").tasks.named("jar")
	dependsOn project(":jni-agent").tasks.named("jar")
	classpath = sourceSets.hstest.runtimeClasspath
	mainClass = "LayoutGateAssert"
}
tasks.named("check") { dependsOn tasks.named("hstestLayoutGate") }

// ---- SemAssert 场景迁移用的夹具编译（真实 javac 21，与 suite.sh 逐项对齐）----
//
// suite.sh 用 `javac -nowarn -encoding UTF-8`（无 -g/-parameters），SemAssert 的 15 个夹具
// 全部 JDK21。Gradle 的 JavaCompile 默认会加 `-g`，必须显式把 debugLevel 钉成 javac 默认
// 的 "source,lines"，否则 .class 字节不同、与 suite.sh 产物对不上哈希。
//
// 源位置：Case 在 scratch/hstest/<group>/<ver>/，helper（同包替身）在 scratch/hstest/<group>/。
// 输出：build/hstest-fixtures/jdk21/<group>/<ver>/（DirFx 按 <group>/<ver>/<pkg>/<Case>.class 取）。
def hstestFixtureRoot = layout.buildDirectory.dir("hstest-fixtures")
def hstestFixtureSpecs = [
	// [group, ver, helper 源(相对 scratch/hstest，可为 null)]
	["swap2", "v1", "swap2/Time.java"], ["swap2", "v2", "swap2/Time.java"],
	["leaf",  "v1", null],              ["leaf",  "v2", null], ["leaf", "v3", null],
	["deep",  "v1", "deep/Time.java"],  ["deep",  "v2", "deep/Time.java"],
	["two",   "v1", "two/Time2.java"],  ["two",   "v2", "two/Time2.java"],
	["deep2", "v1", "deep2/Time3.java"],["deep2", "v2", "deep2/Time3.java"], ["deep2", "v3", "deep2/Time3.java"],
	["save3", "v1", "save3/Time4.java"],["save3", "v2", "save3/Time4.java"], ["save3", "v3", "save3/Time4.java"],
]
def hstestFixtureJdk = 21
def hstestFixtureTasks = hstestFixtureSpecs.collect { g, v, helper ->
	tasks.register("hstestFx_${g}_${v}", JavaCompile) {
		group = "verification"
		description = "编译 SemAssert 夹具 ${g}/${v} (jdk${hstestFixtureJdk})"
		source = files(fileTree("scratch/hstest/${g}/${v}") { include "**/*.java" },
		               helper ? [file("scratch/hstest/${helper}")] : [])
		classpath = files()   // 夹具不依赖项目库
		destinationDirectory = hstestFixtureRoot.map { it.dir("jdk${hstestFixtureJdk}/${g}/${v}") }
		javaCompiler = javaToolchains.compilerFor {
			languageVersion = JavaLanguageVersion.of(hstestFixtureJdk)
		}
		options.encoding = "UTF-8"
		options.warnings = false                          // -nowarn
		options.debug = true
		options.debugOptions.debugLevel = "source,lines"  // javac 默认；不写 Gradle 会发 -g（含 vars）
		sourceCompatibility = "${hstestFixtureJdk}"
		targetCompatibility = "${hstestFixtureJdk}"
	}
}

// JUnit 试点入口：把 hstest 里可纯函数化、可场景隔离的断言逐步迁到 JUnit。
// 与 hstestRun（suite.sh / main 程序 + expected-count 基线）并存并跑，迁移期间两套都在。
// 注意：
//  • useJUnitPlatform + junit-platform-launcher（runtimeOnly）缺一不可；
//  • maxParallelForks=1：对齐器与 HotSwapAgent 有可变静态状态（bytecodeCache 等）；
//  • 运行期仍需 hotswap-agent / jni-agent 的 jar（runtimeClasspath 走 build/libs）。
tasks.register("hstestJunit", Test) {
	group = "verification"
	description = "hstest 的 JUnit 入口（试点：布局门接线 + SemAssert 场景）"
	testClassesDirs = sourceSets.hstest.output.classesDirs
	classpath = sourceSets.hstest.runtimeClasspath
	dependsOn tasks.named("hstestClasses")
	dependsOn project(":hotswap-agent").tasks.named("jar")
	dependsOn project(":jni-agent").tasks.named("jar")
	dependsOn hstestFixtureTasks
	inputs.dir(hstestFixtureRoot)   // 夹具变了必须重跑
	useJUnitPlatform()
	maxParallelForks = 1
	jvmArgs "--add-exports", "java.base/jdk.internal.misc=ALL-UNNAMED",
	        "-Dfile.encoding=UTF-8", "-Dstdout.encoding=UTF-8", "-Dstderr.encoding=UTF-8"
	systemProperty "hstest.fixtures", hstestFixtureRoot.get().asFile.absolutePath
	testLogging {
		events "failed"
		exceptionFormat "full"
		showStandardStreams = false
	}
}
tasks.named("check") { dependsOn tasks.named("hstestJunit") }

// 幽灵桩熔断的栈探测判据（先红后绿）：透明帧必须穿透动态代理 / CellPropertyRef handler /
// 方法句柄帧，否则被 CellPropertyRef 代理包过的回调在 UpdateRef 发起时不熔断（60FPS 空转）。
tasks.register("hstestGhostProbe", JavaExec) {
	group = "verification"
	description = "运行幽灵桩熔断栈探测断言（GhostProbe）"
	dependsOn tasks.named("hstestClasses")
	dependsOn project(":hotswap-agent").tasks.named("jar")
	dependsOn project(":jni-agent").tasks.named("jar")
	classpath = sourceSets.hstest.runtimeClasspath
	mainClass = "GhostProbe"
}
tasks.named("check") { dependsOn tasks.named("hstestGhostProbe") }

// InitFix 差分 Oracle（docs/INIT_FIX.md §8 P0-5）。
//
// 与 SemAssert 不同，它**不需要**任何外部 javac：夹具用 javax.tools 在内存里编译，
// 因此可以作为 check 的常驻门槛。但必须依赖 hotswap-agent 的 jar 重建 ——
// runtimeClasspath 解析到的是 build/libs 下的 jar，而不是 classes 目录
// （见 hstestRun 上方同一坑的注释），少了 dependsOn jar 会跑出陈旧结果。
tasks.register("hstestInitFixOracle", JavaExec) {
	group = "verification"
	description = "运行 InitFix 差分 Oracle（正向值比对 + 负向阻断断言）"
	dependsOn tasks.named("hstestClasses")
	dependsOn project(":hotswap-agent").tasks.named("jar")
	dependsOn project(":jni-agent").tasks.named("jar")
	classpath = sourceSets.hstest.runtimeClasspath
	mainClass = "InitFixOracle"
	// Kotlin 夹具：两个 source set 各自编 v1/v2，输出目录按路径（-D）传入 oracle。
	// 注意：只传路径，不进 classpath —— 同名 v1/v2 上 classpath 会互相遮蔽。
	dependsOn tasks.named("compileKtfixV1Kotlin")
	dependsOn tasks.named("compileKtfixV2Kotlin")
	systemProperty "nipx.ktfix.v1", sourceSets.ktfixV1.output.classesDirs.asPath
	systemProperty "nipx.ktfix.v2", sourceSets.ktfixV2.output.classesDirs.asPath
	// InitFix 直接引用 jdk.internal.misc.Unsafe（`Unsafe UNSAFE = Unsafe.getUnsafe()`），
	// 因此运行期必须显式导出该包 —— 生产环境的 launcher 也是这么给的（见 .idea/compiler.xml
	// 与游戏启动参数里的 --add-exports java.base/jdk.internal.misc=ALL-UNNAMED）。
	jvmArgs("--add-exports", "java.base/jdk.internal.misc=ALL-UNNAMED")
	// Force UTF-8 for the forked JVM so redirected stdout/stderr can be read as UTF-8
	// (the oracle prints Chinese scenario names / assertion messages).
	jvmArgs("-Dfile.encoding=UTF-8", "-Dstdout.encoding=UTF-8", "-Dstderr.encoding=UTF-8")
}
tasks.named("check") { dependsOn tasks.named("hstestInitFixOracle") }

// 套件唯一入口：classpath 由 Gradle 解析后经环境变量传入，脚本内不手写 classpath。
tasks.register("hstestRun", Exec) {
	// 必须同时依赖 **jar 重建**！
	//
	// hstest 的 runtimeClasspath 通过 project(":hotswap-agent") 解析到
	// build/libs/hotswap-agent-1.6.0.jar（**不是** build/classes/java/main），
	// 而 Gradle 不会因为 compileJava 就自动重打 jar。
	// 少了下面两行，测试跑的是**陈旧 jar** —— 实测代价：数轮里匹配逻辑的改动
	// 全部"改了没生效"，因为改动只进了 classes、没进 jar。
	dependsOn tasks.named("hstestClasses")
	dependsOn project(":hotswap-agent").tasks.named("jar")
	dependsOn project(":jni-agent").tasks.named("jar")
	group = "verification"
	description = "运行对齐器验证套件（含数量基线；失败则构建失败）"
	workingDir = file("$rootDir/scratch/hstest")
	// 用命令行参数传 classpath（环境变量在 Exec 下不可靠），
	// 并在配置期冻结为字符串，避免 Exec 延迟求值时拿到空值。
	def cp = sourceSets.hstest.runtimeClasspath.asPath
	def javaBin = "${System.getProperty('java.home')}/bin/java"
	// 三个 javac 在 Gradle 侧解析成**绝对路径**，与 daemon 的 PATH 解耦
	def jdk8 = System.getenv('HSTEST_JAVAC8') ?: 'F:/files/java/jdks/jdk-1.8/bin/javac.exe'
	def jdk17 = System.getenv('HSTEST_JAVAC17') ?: 'F:/files/java/jdks/jdk-17.0.2/bin/javac.exe'
	def jdk21 = System.getenv('HSTEST_JAVAC21') ?: 'F:/files/java/jdks/openjdk-21.0.2/bin/javac.exe'
	[[jdk8, true], [jdk17, true], [jdk21, true]].each { f, _ ->
		if (!new File(f).exists()) logger.warn("hstest: javac 不存在: " + f)
	}
	doFirst {
		// 必须指定 **Git Bash 的绝对路径**。
		//
		// PATH 上的 `bash` 会解析到 C:\Windows\System32\bash.exe —— 那是 **WSL**，
		// 而 WSL 是 Linux，**根本执行不了 Windows 的 javac.exe**（F: 也不在 /mnt 下）。
		// 实测症状：cwd=/mnt/e/...、javac=/mnt/f/...: No such file or directory。
		// 因此不依赖 PATH，直接找 Git Bash。
		def candidates = ["E:/Program Files/Git/bin/bash.exe",
		                  "C:/Program Files/Git/bin/bash.exe",
		                  "E:/Program Files/Git/usr/bin/bash.exe",
		                  "C:/Program Files/Git/usr/bin/bash.exe"]
		def gitBash = candidates.find { new File(it).exists() }
		if (gitBash == null) {
			throw new GradleException("hstest 需要 Git Bash，但以下路径都没有: " + candidates)
		}
		logger.lifecycle("hstest: Git Bash = " + gitBash)
		commandLine gitBash, "suite.sh", cp
		environment "HSTEST_JAVA", javaBin
		environment "HSTEST_JAVAC8", jdk8
		environment "HSTEST_JAVAC17", jdk17
		environment "HSTEST_JAVAC21", jdk21
	}
	standardOutput = System.out
	errorOutput = System.err
}
tasks.named("check") { dependsOn tasks.named("hstestRun") }

// 打印 hstest 运行 classpath，供手工实验复用（唯一可信来源，避免手拼）
tasks.register("hstestCp") {
	doLast {
		println sourceSets.hstest.runtimeClasspath.asPath
	}
}
