def extractHiddenApiBypass = tasks.register('extractHiddenApiBypass', Jar) {
	// AAR 里面的 classes.jar 再套一层 zipTree
	from {
		zipTree(configurations.aarLib.singleFile).matching { include 'classes.jar' }
				.collect {
					println "classes.jar: $it"
					return zipTree(it)
				}
	}
	archiveFileName = "hiddenapibypass.jar"
	println archiveFileName
	destinationDirectory = layout.buildDirectory.dir("libs")
}

configurations {
	/**
	 * core 的 shadow 变体，也就是真正的 agent jar（remold-agent.jar）：
	 * ASM 已重定位到 remold.internal.asm、natives 打进 libs/。
	 * 默认变体是 raw 瘦 jar，直接当 agent 挂上去会因为缺 ASM 而跑不起来。
	 */
	remoldAgentLib {
		canBeResolved = true
		canBeConsumed = false
		transitive = false
		attributes {
			attribute(org.gradle.api.attributes.Bundling.BUNDLING_ATTRIBUTE,
					objects.named(org.gradle.api.attributes.Bundling, org.gradle.api.attributes.Bundling.SHADOWED))
		}
	}
	/** plugin-arc：remold/arc、remold/ref、remold/profiler、remold/uihook，mod 自己也要链接它们 */
	remoldPluginArcLib {
		canBeResolved = true
		canBeConsumed = false
		transitive = false
	}
	/** plugin-arc 里 Injector/CellPropertyRef 用的是未重定位的 org.objectweb.asm */
	remoldAsmLib {
		canBeResolved = true
		canBeConsumed = false
	}
	/** 单独的 panama 后端，JDK22+ 才由 UtilsAgentManager 挂到 bootstrap */
	remoldPanamaLib {
		canBeResolved = true
		canBeConsumed = false
		transitive = false
	}
}

