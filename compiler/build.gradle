plugins {
    id 'java'
    id 'maven-publish'
}

// 主源集直接就是 src/，必须把测试目录排除掉，否则 src/test/java 会被当成主代码编译
sourceSets {
	main {
		java {
			srcDirs = ["src"]
			exclude "test/**"
		}
	}
	test {
		java {
			srcDirs = ["src/test/java"]
		}
	}
}

publishing {
	publications {
		maven(MavenPublication) {
			from components.java
		}
	}
}
dependencies {
	implementation project(":annotations")

	compileOnly 'com.google.auto.service:auto-service:1.1.1'
	annotationProcessor 'com.google.auto.service:auto-service:1.1.1'
	annotationProcessor files("$compilerJar")

	def asmVersion = '9.11'
	implementation "org.ow2.asm:asm:$asmVersion"
	implementation "org.ow2.asm:asm-commons:$asmVersion"
	implementation "org.ow2.asm:asm-analysis:$asmVersion"
	implementation "org.ow2.asm:asm-util:$asmVersion"
	implementation "org.ow2.asm:asm-tree:$asmVersion"

//	annotationProcessor "com.github.EB-wilson.UniverseCore:annotations:$uncVersion"

//	implementation files("libs/Internal.jar")

//	implementation "com.github.Anuken.Arc:arc-core:$mindustryVersion"
//	implementation "com.github.Anuken.Mindustry:core:$mindustryVersion"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	// 测试直接在进程内驱动 javac 的 Context/AST，需要与主构建一致的模块开放
	def testExports = [
		'java.base/jdk.internal.misc',
		'java.base/jdk.internal.reflect',
		'java.base/jdk.internal.module',
		'java.base/jdk.internal.access',
		'java.base/sun.reflect.annotation',
		'jdk.compiler/com.sun.tools.javac.api',
		'jdk.compiler/com.sun.tools.javac.code',
		'jdk.compiler/com.sun.tools.javac.comp',
		'jdk.compiler/com.sun.tools.javac.file',
		'jdk.compiler/com.sun.tools.javac.jvm',
		'jdk.compiler/com.sun.tools.javac.main',
		'jdk.compiler/com.sun.tools.javac.model',
		'jdk.compiler/com.sun.tools.javac.parser',
		'jdk.compiler/com.sun.tools.javac.processing',
		'jdk.compiler/com.sun.tools.javac.tree',
		'jdk.compiler/com.sun.tools.javac.util',
	]
	jvmArgs += testExports.collect { "--add-exports=$it=ALL-UNNAMED" }
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}
jar {
	exclude "module-info.class"
	from(configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) })
}


task anno(type: Jar) {
	dependsOn jar

	archiveFileName = "$buildDir0/libs/anno/${project.name}-${project.version}.jar"

	from(zipTree("$buildDir0/libs/${project.name}-${project.version}.jar")) {
		exclude("META-INF/services/javax.annotation.processing.Processor")
	}
//	from(zipTree("$buildDir0.parent/ProcessorConfig.zip"))
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

task setMdtClassVersion(type: JavaExec) {
	dependsOn jar

	//运行游戏目录
	classpath("$buildDir0/libs/${base.archivesName.get()}-${version}.jar")
	args = [
//			'-testMobile'
//			'-debug'
	]
}
