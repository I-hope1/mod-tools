plugins {
	id 'java-library'
	id 'maven-publish'
	id 'com.gradleup.shadow'
}

sourceSets.main.java.srcDirs = ["src"]

publishing {
	publications {
		maven(MavenPublication) {
			from components.java
		}
	}
}
dependencies {
	api project(':hotswap-api')
	compileOnly project(':jni-agent')

	// asm
	def asmVersion = '9.9.1'
	api "org.ow2.asm:asm:$asmVersion"
	api "org.ow2.asm:asm-commons:$asmVersion"
	api "org.ow2.asm:asm-analysis:$asmVersion"
	api "org.ow2.asm:asm-util:$asmVersion"
	api "org.ow2.asm:asm-tree:$asmVersion"

	implementation files("$rootDir/_libs/magicClass.jar")
}

shadowJar {
	archiveClassifier.set('')
	manifest {
		attributes(
				'Agent-Class': 'nipx.HotSwapAgent',
				'Premain-Class': 'nipx.HotSwapAgent',
				'Can-Retransform-Classes': true,
				'Can-Redefine-Classes': true
		)
	}
	exclude "module-info.class"
	relocate 'org.objectweb.asm', 'nipx.internal.asm'
}

jar {
	dependsOn shadowJar
	archiveClassifier.set('raw')
}

dependencies {
	annotationProcessor files(compilerJar)
}


test {
	useJUnitPlatform()
	// 本模块没有 JUnit 测试（测试入口是 scratch/hstest 下的 JUnit 套件，由 hstestJunit 跑）。
	// 不设这一条时，`:test` 会因"有测试源但没发现测试"而失败 —— 那是既有问题，
	// 与本次改动无关，但会让 `check` 永远红。
	failOnNoDiscoveredTests = false
}