def graalVMJdk = new File("F:/files/java/jdks/graalvm-jdk-21.0.12/bin/java.exe")
def openJdk = new File("F:/files/java/jdks/openjdk-21.0.2/bin/java.exe")
def jsBenchmarkJdk = (project.findProperty('jsJdk') == 'openjdk') ? openJdk : (graalVMJdk.exists() ? graalVMJdk : openJdk)

tasks.register('jmhJS', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'org.openjdk.jmh.Main'
	jvmArgs(
			"-Dpolyglot.engine.WarnInterpreterOnly=true",
			'-XX:+EnableJVMCI',
			'-XX:+UseJVMCICompiler',
	)
	args = [
			'hope.magic.example.MagicJSBenchmark',
			'-f', '3',
			'-wi', '3',
			'-i', '5',
			'-bm', 'avgt',
			'-tu', 'ns',
			'-prof', 'gc',
	]
	if (jsBenchmarkJdk.exists()) {
		executable = jsBenchmarkJdk.absolutePath
	}
}

tasks.register('jmhInvoker', JavaExec) {
