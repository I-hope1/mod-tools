plugins {
	id 'application'
}

dependencies {
	implementation project.findProject(':magic-accessor:annotations') ?: project(':annotations')
	annotationProcessor project.findProject(':magic-accessor:compiler') ?: project(':compiler')
	implementation project(':magic-accessor:magic-js')
	implementation 'org.mozilla:rhino:1.9.1'
	implementation 'org.openjdk.nashorn:nashorn-core:15.7'
	implementation 'com.googlecode.aviator:aviator:5.4.4'
	implementation 'org.graalvm.polyglot:polyglot:24.1.2'
	implementation 'org.graalvm.polyglot:js-community:24.1.2'
	implementation 'org.ow2.asm:asm:9.9.1'

	implementation 'org.openjdk.jmh:jmh-core:1.37'
	annotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

application {
	mainClass = 'hope.magic.example.Main'
	applicationDefaultJvmArgs = [
		'--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED',
		'--add-exports=java.base/jdk.internal.reflect=ALL-UNNAMED'
	]
}

tasks.named('run', JavaExec) {
	if (new File("F:/files/java/jdks/openjdk-21.0.2/bin/java.exe").exists()) {
		executable = "F:/files/java/jdks/openjdk-21.0.2/bin/java.exe"
	}
}

tasks.register('jmh', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'org.openjdk.jmh.Main'
	args = [
		'hope.magic.example.AccessorBenchmark',
		'-f', '1',
		'-wi', '2',
		'-i', '3',
		'-bm', 'avgt',
		'-tu', 'ns'
	]
	if (new File("F:/files/java/jdks/openjdk-21.0.2/bin/java.exe").exists()) {
		executable = "F:/files/java/jdks/openjdk-21.0.2/bin/java.exe"
	}
}

tasks.register('jmhWarmup1', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'org.openjdk.jmh.Main'
	args = [
		'hope.magic.example.AccessorWarmupOnceBenchmark',
		'-f', '1',
		'-wi', '1',
		'-i', '3',
		'-bm', 'avgt',
		'-tu', 'ns'
	]
	if (new File("F:/files/java/jdks/openjdk-21.0.2/bin/java.exe").exists()) {
		executable = "F:/files/java/jdks/openjdk-21.0.2/bin/java.exe"
	}
}

tasks.register('jmhCold', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'org.openjdk.jmh.Main'
	args = [
		'hope.magic.example.AccessorColdStartBenchmark',
		'-f', '5',
		'-wi', '0',
		'-i', '1',
		'-bm', 'ss',
		'-tu', 'us'
	]
	if (new File("F:/files/java/jdks/openjdk-21.0.2/bin/java.exe").exists()) {
		executable = "F:/files/java/jdks/openjdk-21.0.2/bin/java.exe"
	}
}

tasks.register('jmhDecode', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'org.openjdk.jmh.Main'
	args = [
		'hope.magic.example.BytecodeDecodeMicroBenchmark',
		'-f', '1',
		'-wi', '2',
		'-i', '3',
		'-bm', 'avgt',
		'-tu', 'ns'
	]
	if (new File("F:/files/java/jdks/openjdk-21.0.2/bin/java.exe").exists()) {
		executable = "F:/files/java/jdks/openjdk-21.0.2/bin/java.exe"
	}
}

def graalVMJdk = new File("F:/files/java/jdks/graalvm-jdk-21.0.12/bin/java.exe")
def openJdk = new File("F:/files/java/jdks/openjdk-21.0.2/bin/java.exe")
def jsBenchmarkJdk = (project.findProperty('jsJdk') == 'openjdk') ? openJdk : (graalVMJdk.exists() ? graalVMJdk : openJdk)

tasks.register('jmhJS', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'org.openjdk.jmh.Main'
	jvmArgs(
			"-Dpolyglot.engine.WarnInterpreterOnly=true",
	)
	args = [
		'hope.magic.example.MagicJSBenchmark',
		'-f', '1',
		'-wi', '2',
		'-i', '3',
		'-bm', 'avgt',
		'-tu', 'ns'
	]
	if (jsBenchmarkJdk.exists()) {
		executable = jsBenchmarkJdk.absolutePath
	}
}

tasks.register('jmhInvoker', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'org.openjdk.jmh.Main'
	args = [
		'hope.magic.example.DynamicInvokerBenchmark',
		'-f', '3',
		'-wi', '5',
		'-i', '10',
		'-bm', 'avgt',
		'-tu', 'ns'
	]
	if (new File("F:/files/java/jdks/openjdk-21.0.2/bin/java.exe").exists()) {
		executable = "F:/files/java/jdks/openjdk-21.0.2/bin/java.exe"
	}
}

tasks.register('coldJS', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'hope.magic.example.MagicJSColdStartBenchmark'
	if (jsBenchmarkJdk.exists()) {
		executable = jsBenchmarkJdk.absolutePath
	}
}

tasks.register('gradientJS', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'hope.magic.example.GradientShapeBenchmark'
	if (jsBenchmarkJdk.exists()) {
		executable = jsBenchmarkJdk.absolutePath
	}
}

tasks.register('compareAviator', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'hope.magic.example.AviatorComparisonBenchmark'
	if (new File("F:/files/java/jdks/openjdk-21.0.2/bin/java.exe").exists()) {
		executable = "F:/files/java/jdks/openjdk-21.0.2/bin/java.exe"
	}
}

tasks.register('printInlining', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'hope.magic.example.MagicJSInliningBenchmark'
	jvmArgs = [
		'-XX:+UnlockDiagnosticVMOptions',
		'-XX:+PrintInlining',
		'-XX:+TieredCompilation',
		'-XX:CICompilerCount=2',
	]
	if (jsBenchmarkJdk.exists()) {
		executable = jsBenchmarkJdk.absolutePath
	}
}
