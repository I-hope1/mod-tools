pluginManagement {
	repositories {
		maven { url 'https://maven.aliyun.com/repository/public' }
		maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
		gradlePluginPortal()
		mavenCentral()
	}
	plugins {
		id 'org.jetbrains.kotlin.jvm' version '2.3.0'
		id 'com.gradleup.shadow' version '9.6.1'
	}
}
plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name = "mod-tools"

include 'annotations'
include 'compiler'
include 'test'

include 'utils-agent'

if (file('../nipx-hotswap').exists()) {
	includeBuild('../nipx-hotswap')
} else if (file('../Remold').exists()) {
	includeBuild('../Remold')
}

include 'magic-accessor:annotations'
include 'magic-accessor:compiler'
include 'magic-accessor:example'
include 'magic-accessor:magic-js'

dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		mavenLocal()
		mavenCentral()
		maven { url 'https://jitpack.io' }
		maven { url 'https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository' }
		maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
		google()
		//Downloads the server-release JAR file from Mindustry releases; does not use any real repository. Surprisingly, this is the most reliable option.
		ivy {
			url 'https://github.com/'
			patternLayout { artifact '/[organisation]/[module]/releases/download/[revision]/dependencies.jar' }
			metadataSources { artifact() }
		}
	}
}
